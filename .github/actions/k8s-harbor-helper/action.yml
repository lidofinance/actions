name: K8s Harbor workflow helper
description: Security validation and report processing for the Harbor reusable workflow

inputs:
  command:
    description: Helper command to execute
    required: true

outputs:
  dhi_policy:
    description: Validated DHI exceptions snapshot or empty fallback
    value: ${{ steps.helper.outputs.dhi_policy }}
  dhi_policy_dir:
    description: Directory containing the effective policy and source metadata
    value: ${{ steps.helper.outputs.dhi_policy_dir }}
  dhi_policy_id:
    description: Unique snapshot identifier for the policy artifact
    value: ${{ steps.helper.outputs.dhi_policy_id }}
  dhi_policy_sha:
    description: Resolved policy commit, if the branch lookup succeeded
    value: ${{ steps.helper.outputs.dhi_policy_sha }}
  context_dir:
    description: Isolated Docker build context
    value: ${{ steps.helper.outputs.context_dir }}
  dockerfile:
    description: Validated Dockerfile path
    value: ${{ steps.helper.outputs.dockerfile }}
  github_environment:
    description: Trusted GitHub Environment for the target
    value: ${{ steps.helper.outputs.github_environment }}
  image_digest:
    description: Published image digest
    value: ${{ steps.helper.outputs.image_digest }}
  image_ref:
    description: Published image reference
    value: ${{ steps.helper.outputs.image_ref }}
  image_tag:
    description: Image tag selected for the target
    value: ${{ steps.helper.outputs.image_tag }}
  is_release:
    description: Whether this is a production-style release
    value: ${{ steps.helper.outputs.is_release }}
  remote_name:
    description: Harbor image name without a tag
    value: ${{ steps.helper.outputs.remote_name }}
  requested_source_branch:
    description: Source branch requested for a non-release build
    value: ${{ steps.helper.outputs.requested_source_branch }}
  source_branch:
    description: Validated source branch
    value: ${{ steps.helper.outputs.source_branch }}
  source_ref:
    description: Git ref selected for checkout
    value: ${{ steps.helper.outputs.source_ref }}
  source_sha:
    description: Validated source commit
    value: ${{ steps.helper.outputs.source_sha }}
  vex_config:
    description: Trusted VEX repository configuration from the pinned helper
    value: ${{ steps.helper.outputs.vex_config }}

runs:
  using: composite
  steps:
    - name: Run Harbor workflow helper
      id: helper
      shell: bash
      env:
        HELPER_COMMAND: ${{ inputs.command }}
      run: python3 "$GITHUB_ACTION_PATH/main.py" "$HELPER_COMMAND"
