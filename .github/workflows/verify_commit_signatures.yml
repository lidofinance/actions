name: Verify commit signatures

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # TODO: Remove this exemption after lidofinance/actions is added to config.py.
    if: github.repository != 'lidofinance/actions'
    name: Verify commit signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify introduced commit signatures
        uses: lidofinance/actions/.github/actions/verify-commit-signatures@91192562f394f8d9844075fc1e8ba7586a309682
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
