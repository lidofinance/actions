name: Verify commit signatures

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    # This repository permits committers outside the shared trusted-key set.
    if: github.repository != 'lidofinance/actions'
    name: Verify commit signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout pull request head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify introduced commit signatures
        # used main branch instead of hash during an initial rollout, with the `permissions: contents: read` it's harmless
        uses: lidofinance/actions/.github/actions/verify-commit-signatures@main
        with:
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.event.pull_request.head.sha }}
