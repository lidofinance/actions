# Socket dependency scan of a release commit. Called from
# k8s-build-push-harbor.yml between its "validate" and "publish" jobs.
#
# Scans every dependency manifest of the commit that is about to be built and
# stops the release when the organization policy says Block. Target "dev" only
# reports.
#
# Five things here are not obvious:
#
# 1. A separate job. The scan checks out the application code and runs the
#    reachability engine on it. It must not share a job with the Harbor and DHI
#    credentials of "publish".
# 2. Empty baseline scan, the same as in socketdev-pr-scan.yml. Each run
#    compares the commit with its own empty scan, so every finding is new and
#    the whole snapshot is assessed. Compared with an earlier scan, Socket
#    Python CLI 2.13.2 loses findings of unchanged packages: it merges the
#    advisories of one package that share a severity and keeps the action of
#    the first one.
# 3. No --scm github. With it the CLI makes a plain scan on workflow_dispatch
#    and skips the scan on workflow_run and release, and it never blocks on
#    either. Without it the CLI compares the scan on every event.
# 4. The lock file is checked out by a commit SHA. A called workflow cannot
#    read its own commit: github.workflow_sha is the commit of the caller.
# 5. Reachability with a fallback, the same as in socketdev-pr-scan.yml. A
#    repository skips the analysis by setting the repository variable
#    SOCKET_REACHABILITY to "off".
#
# Verdicts: "pass" = scanned, no Block (Warn is allowed); "block" = the policy
# says Block; "not-scanned" = no completed assessment, whatever the reason.
# Every target except "dev" is stopped on "block" and on "not-scanned".
#
# Scan exit codes: 0 = no Block, 1 = Block, 2 = invalid CLI flags, 3 = Socket
# API or runtime error.

name: Socket release scan

on:
  workflow_call:
    inputs:
      source_sha:
        description: Commit to scan, already validated by the caller
        required: true
        type: string
      source_branch:
        description: Branch the commit is released from
        required: true
        type: string
      target:
        description: "Deployment target: dev, staging, prod, or critical"
        required: true
        type: string
    secrets:
      SOCKET_SECURITY_API_KEY:
        description: Socket API key of the organization
        required: false # a missing key gives the verdict "not-scanned" instead of a failed call
    outputs:
      verdict:
        description: pass, block, or not-scanned
        value: ${{ jobs.scan.outputs.verdict }}

permissions:
  contents: read

jobs:
  scan:
    name: Socket dependency security
    runs-on: ubuntu-24.04 # the lock file is pinned to CPython 3.12 / Linux x86_64
    timeout-minutes: 12 # one scan takes 1-3 minutes; a stuck Socket request would otherwise hold the release
    # Target "dev" only reports: a step that fails before the verdict must not
    # stop the build of a development image.
    continue-on-error: ${{ inputs.target == 'dev' }}
    defaults:
      run:
        shell: bash
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    env:
      SCAN_REPO: ${{ github.event.repository.name }}
      SCAN_BRANCH: ${{ inputs.source_branch }}
      SCAN_COMMIT: ${{ inputs.source_sha }}
      TARGET: ${{ inputs.target }}
      # Set explicitly so that no .env file in the commit can redirect the API key elsewhere.
      BASE_API_URL: https://api.socket.dev/v0
      # The reachability engine (Coana CLI). Update together with the CLI lock file.
      REACH_ENGINE_VERSION: 15.15.2
    steps:
      - name: Check out the scanner lock file from the central repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: lidofinance/actions
          # The commit that holds the lock file of Socket Python CLI 2.13.2.
          # Update it together with the lock file.
          ref: d582517d791477f5ca5719782b7a49a6af71a9ba
          path: tooling
          sparse-checkout: .github/tools
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Set up Node.js for the reachability engine
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22' # the engine needs 22.13 or newer

      - name: Install the hash-pinned Socket CLI
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r tooling/.github/tools/socket-python-cli.lock
          socketcli --version
          node --version
          npm --version
          uv --version

      - name: Create the empty baseline scan
        id: baseline
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
        run: |
          : "${SOCKET_SECURITY_API_KEY:?SOCKET_SECURITY_API_KEY is not available to this repository or event}"
          mkdir -p "$RUNNER_TEMP/socket" "$RUNNER_TEMP/socket-empty"
          cd "$RUNNER_TEMP/socket-empty"

          # The API accepts only known manifest names. An empty facts document is
          # the placeholder the CLI itself uses for an empty scan.
          echo '{"components": []}' > .socket.facts.json

          # curl reads the API key from stdin, so the key never appears in a
          # process argument list.
          socket_api() {
            printf 'user = "%s:"\n' "$SOCKET_SECURITY_API_KEY" |
              curl -fsS --max-time 60 -K - "$@"
          }

          org="$(socket_api "$BASE_API_URL/organizations" |
            jq -r '.organizations | to_entries | if length == 1 then .[0].value.slug else empty end')"
          if [ -z "$org" ]; then
            echo '::error::The Socket API key must belong to exactly one organization.'
            exit 3
          fi

          # tmp=true keeps this service scan out of the Socket dashboard. The CLI
          # has no flag for it, so this one request goes to the API directly.
          socket_api -X POST \
            -F '.socket.facts.json=@.socket.facts.json' \
            "$BASE_API_URL/orgs/$org/full-scans?repo=$SCAN_REPO&branch=socket-empty-baseline&tmp=true" \
            > "$RUNNER_TEMP/socket/baseline.json"

          scan_id="$(jq -r '.id // empty' "$RUNNER_TEMP/socket/baseline.json")"
          if [ -z "$scan_id" ]; then
            echo '::error::Socket did not return the ID of the empty baseline scan.'
            exit 3
          fi
          echo "scan_id=$scan_id" >> "$GITHUB_OUTPUT"

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: false

      - name: Fail when the commit contains a reachability facts file
        # The CLI uploads every .socket.facts.json it finds, and Socket lowers
        # findings based on that data. Only this workflow may produce that file,
        # so one committed to the repository stops the job before the scan.
        working-directory: candidate
        run: |
          found="$(find . -path ./.git -prune -o \( -type f -o -type l \) -name '.socket.facts.json*' -print)"
          [ -z "$found" ] && exit 0
          while IFS= read -r file; do
            echo "::error::Reachability facts file committed to the repository: $file"
          done <<< "$found"
          echo '::error::Not scanned. Please contact SecOps to investigate the issue.'
          exit 2

      - name: Scan the release commit
        id: scan
        working-directory: candidate
        env:
          SOCKET_SECURITY_API_KEY: ${{ secrets.SOCKET_SECURITY_API_KEY }}
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
          REACHABILITY: ${{ vars.SOCKET_REACHABILITY }}
          # The reachability engine downloads packages with npm. It must never run
          # their install scripts in this step, which holds the Socket API key.
          NPM_CONFIG_IGNORE_SCRIPTS: 'true'
        run: |
          # --base-scan-id        compare with the empty baseline: every finding is new
          # --ignore-commit-files compare scans whatever files the last commit touched
          # --strict-blocking     fail on any Block, not only on new ones
          # --reach               analyse the code and lower findings that are not reachable
          # --reach-disable-analytics  do not send analysis statistics to Socket
          # --reach-version       the engine version; the same one this CLI release pins
          #
          # The reachability flags are kept in reach_flags, because the second attempt
          # below runs the same command without them.
          reach_flags=(
            --reach
            --reach-disable-analytics
            --reach-version "$REACH_ENGINE_VERSION"
          )
          if [ "${REACHABILITY,,}" = off ]; then # any letter case
            echo '::notice::Reachability analysis is switched off by the repository variable SOCKET_REACHABILITY.'
            reach_flags=()
          fi
          scan() {
            socketcli \
              --repo "$SCAN_REPO" \
              --branch "$SCAN_BRANCH" \
              --commit-sha "$SCAN_COMMIT" \
              --target-path . \
              --base-scan-id "$BASELINE_SCAN_ID" \
              --ignore-commit-files \
              --strict-blocking \
              --json-file "$RUNNER_TEMP/socket/report.json" \
              --summary-file "$RUNNER_TEMP/socket/summary.txt" \
              "${reach_flags[@]}"
          }

          status=0
          scan || status=$?

          # Exit 3 without a report: the first attempt failed before it assessed
          # anything, most often in the reachability analysis. Scan again without it.
          if [ "$status" -eq 3 ] && [ ! -s "$RUNNER_TEMP/socket/report.json" ] && [ "${#reach_flags[@]}" -gt 0 ]; then
            echo '::warning::The first scan attempt produced no report. Scanning again without reachability analysis.'
            touch "$RUNNER_TEMP/socket/reachability-fallback"
            # Drop what the failed analysis left behind, so the second scan does not upload it.
            find . -path ./.git -prune -o -name '.socket.facts.json*' -print0 | xargs -0 rm -f --
            reach_flags=()
            status=0
            scan || status=$?
          fi

          # The next step decides what the exit code means for this target.
          echo "Socket CLI exit code: $status"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Decide the verdict for this target
        id: verdict
        # Runs after a failed step too, but not after a cancel.
        if: ${{ !cancelled() }}
        env:
          STATUS: ${{ steps.scan.outputs.status }}
          BASELINE_SCAN_ID: ${{ steps.baseline.outputs.scan_id }}
        run: |
          report="$RUNNER_TEMP/socket/report.json"

          # A zero exit code is not enough: the CLI exits 0 when it skips the scan
          # or creates a plain scan, and it never blocks on one. The report holds
          # a link to the result in Socket, and its form tells what the CLI did:
          #   compared two scans:       .../diff/<baseline scan>/<release scan>
          #   one scan, no comparison:  .../sbom/<release scan>
          # Only the first form, with our baseline scan in it, counts as scanned.
          # (When Socket marks a comparison incomplete, the CLI itself exits 3.)
          compared=false
          if [ -n "$BASELINE_SCAN_ID" ] && [ -s "$report" ] &&
            [[ "$(jq -r '.diff_url' "$report")" == *"/diff/$BASELINE_SCAN_ID/"* ]]; then
            compared=true
          fi

          if [ "$STATUS" = 1 ]; then
            verdict=block
          elif [ "$STATUS" = 0 ] && [ "$compared" = true ]; then
            verdict=pass
          else
            verdict=not-scanned
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

          {
            echo "## Socket release scan: $verdict"
            echo
            echo "Target \`$TARGET\`, commit \`$SCAN_COMMIT\`, Socket CLI exit code \`${STATUS:-none}\`, compared with the empty baseline: \`$compared\`."
            if [ -e "$RUNNER_TEMP/socket/reachability-fallback" ]; then
              echo
              echo 'The scan with reachability analysis produced no report. These findings are reported without it. The reason is in the log of the scan step.'
            fi
            echo
            if [ -s "$RUNNER_TEMP/socket/summary.txt" ]; then
              echo '```text'
              # GitHub rejects step summaries above 1 MiB.
              head -c 900000 "$RUNNER_TEMP/socket/summary.txt"
              echo
              echo '```'
            else
              echo 'No completed assessment. See the failed step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          [ "$verdict" = pass ] && exit 0
          # The same rule as for Trivy: dev reports, every other target is gated.
          if [ "$TARGET" = dev ]; then
            echo "::warning::Socket verdict is \"$verdict\". Target dev is report-only, the release continues."
            exit 0
          fi
          echo "::error::Socket verdict is \"$verdict\". The release to $TARGET is stopped."
          exit 1

      - name: Upload scan results
        if: always()
        continue-on-error: true # one caller run may scan the same target more than once
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: socket-release-${{ github.repository_id }}-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/socket/
          if-no-files-found: warn
          retention-days: 30
