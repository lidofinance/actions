name: Reusable build and push image to Harbor

# Canonical registry authority used for image-scoped VEX statements.
env:
  PROD_HOST: harbor-core:80

on:
  workflow_call:
    inputs:
      target:
        description: "Deployment target: dev, staging, prod, or critical"
        required: true
        type: string
      tag:
        description: Published stable GitHub Release tag for prod or critical
        required: false
        type: string
        default: ""
      harbor_project:
        description: Harbor project owned by the calling team
        required: true
        type: string
      image:
        description: Image name inside the Harbor project
        required: true
        type: string
      dockerfile:
        description: Dockerfile path relative to the repository root
        required: false
        type: string
        default: Dockerfile
    secrets:
      VEX_APP_ID:
        description: Application ID for the read-only Lido VEX GitHub App
        required: true
      VEX_APP_PRIVATE_KEY:
        description: PEM private key for the read-only Lido VEX GitHub App
        required: true
    outputs:
      image_ref:
        description: Published image reference with tag
        value: ${{ jobs.publish.outputs.image_ref }}

permissions:
  contents: read

concurrency:
  group: harbor-${{ github.repository_id }}-${{ inputs.target }}-${{ inputs.harbor_project }}-${{ inputs.image }}
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    name: Validate source and inputs
    runs-on: ubuntu-24.04
    outputs:
      github_environment: ${{ steps.config.outputs.github_environment }}
      image_tag: ${{ steps.config.outputs.image_tag }}
      is_release: ${{ steps.config.outputs.is_release }}
      remote_name: ${{ steps.config.outputs.remote_name }}
      source_branch: ${{ steps.source.outputs.source_branch }}
      source_sha: ${{ steps.source.outputs.source_sha }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Configure target and validate inputs
        id: config
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: configure
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          HARBOR_PROJECT: ${{ inputs.harbor_project }}
          IMAGE: ${{ inputs.image }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_PATH: ${{ github.event.workflow_run.path }}
          UPSTREAM_REPOSITORY: ${{ github.event.workflow_run.head_repository.full_name }}

      - name: Checkout source to validate
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ steps.config.outputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Validate source
        id: source
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: validate-source
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          IMAGE_TAG: ${{ steps.config.outputs.image_tag }}
          IS_RELEASE: ${{ steps.config.outputs.is_release }}
          REQUESTED_SOURCE_BRANCH: ${{ steps.config.outputs.requested_source_branch }}
          UPSTREAM_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Validate published GitHub Release
        if: ${{ steps.config.outputs.is_release == 'true' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: validate-release
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.config.outputs.image_tag }}

  publish:
    name: Build and publish image
    needs: validate
    runs-on: ubuntu-24.04
    environment: ${{ needs.validate.outputs.github_environment }}
    outputs:
      image_ref: ${{ steps.push.outputs.image_ref }}

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.13.15"

      - name: Checkout validated commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          ref: ${{ needs.validate.outputs.source_sha }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Revalidate release source
        if: ${{ needs.validate.outputs.is_release == 'true' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: revalidate-release
        env:
          GITHUB_API_URL: ${{ github.api_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}

      - name: Preflight production Harbor release
        if: ${{ needs.validate.outputs.is_release == 'true' && inputs.target == 'prod' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: check-rollback
        env:
          HARBOR_TOKEN: ${{ secrets.HARBOR_PROD_TOKEN }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REMOTE_NAME: ${{ needs.validate.outputs.remote_name }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}

      - name: Preflight critical Harbor release
        if: ${{ needs.validate.outputs.is_release == 'true' && inputs.target == 'critical' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: check-rollback
        env:
          HARBOR_TOKEN: ${{ secrets.HARBOR_CRIT_TOKEN }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REMOTE_NAME: ${{ needs.validate.outputs.remote_name }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}

      - name: Prepare isolated build context
        id: context
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: prepare-context
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          RUNNER_TEMP: ${{ runner.temp }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}

      - name: Download trusted DHI exceptions
        id: dhi-policy
        continue-on-error: true
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: prepare-dhi-policy
        env:
          GITHUB_TOKEN: ${{ secrets.VEX_DB_READ_TOKEN || github.token }}
          RUNNER_TEMP: ${{ runner.temp }}

      - name: Upload effective DHI exceptions and source
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ${{ steps.dhi-policy.outputs.dhi_policy_id }}
          path: ${{ steps.dhi-policy.outputs.dhi_policy_dir }}
          if-no-files-found: warn
          retention-days: 30

      - name: Check DHI base images and approved exceptions
        continue-on-error: true
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: check-dhi
        env:
          TARGET: ${{ inputs.target }}
          DHI_POLICY: ${{ steps.dhi-policy.outputs.dhi_policy }}
          DOCKERFILE: ${{ steps.context.outputs.dockerfile }}
          BUILD_VERSION: ${{ needs.validate.outputs.image_tag }}
          BUILD_BRANCH: ${{ needs.validate.outputs.source_branch }}
          BUILD_COMMIT: ${{ needs.validate.outputs.source_sha }}

      - name: Populate build-info.json
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: populate-build-info
        env:
          BUILD_CONTEXT: ${{ steps.context.outputs.context_dir }}
          BUILD_VERSION: ${{ needs.validate.outputs.image_tag }}
          BUILD_BRANCH: ${{ needs.validate.outputs.source_branch }}
          BUILD_COMMIT: ${{ needs.validate.outputs.source_sha }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@d70bba72b1f3fd22344832f00baa16ece964efeb  # v3.3.0

      - name: Login to DHI registry
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: dhi.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Login to Docker Hub for Lido DHI
        continue-on-error: true
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: docker.io
          username: ${{ secrets.DHI_USERNAME }}
          password: ${{ secrets.DHI_TOKEN }}

      - name: Build Docker image without Harbor credentials
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: ${{ steps.context.outputs.context_dir }}
          file: ${{ steps.context.outputs.dockerfile }}
          push: false
          load: true
          provenance: false
          builder: ${{ steps.buildx.outputs.name }}
          tags: local-build:${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            BUILD_VERSION=${{ needs.validate.outputs.image_tag }}
            BUILD_BRANCH=${{ needs.validate.outputs.source_branch }}
            BUILD_COMMIT=${{ needs.validate.outputs.source_sha }}
          labels: |
            org.opencontainers.image.revision=${{ needs.validate.outputs.source_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.validate.outputs.image_tag }}
          # cache-from: type=gha,scope=${{ github.repository_id }}-${{ inputs.target }}-${{ inputs.harbor_project }}-${{ inputs.image }}
          # cache-to: type=gha,mode=max,scope=${{ github.repository_id }}-${{ inputs.target }}-${{ inputs.harbor_project }}-${{ inputs.image }}

      - name: Create Lido VEX repository token
        id: vex-token
        continue-on-error: ${{ inputs.target == 'dev' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510  # v3.3.0
        with:
          client-id: ${{ secrets.VEX_APP_ID }}
          private-key: ${{ secrets.VEX_APP_PRIVATE_KEY }}
          owner: lidofinance
          repositories: vex
          permission-contents: read

      - name: Prepare trusted Trivy VEX configuration
        id: trivy-config
        if: ${{ steps.vex-token.outcome == 'success' }}
        continue-on-error: ${{ inputs.target == 'dev' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: prepare-trivy
        env:
          RUNNER_TEMP: ${{ runner.temp }}
          VEX_REPO_TOKEN: ${{ steps.vex-token.outputs.token }}

      - name: Scan Docker image from harbor-core:80 with Trivy
        id: trivy-scan
        if: ${{ steps.trivy-config.outcome == 'success' }}
        continue-on-error: ${{ inputs.target == 'dev' }}
        shell: bash
        env:
          LOCAL_IMAGE: local-build:${{ github.run_id }}-${{ github.run_attempt }}
          REMOTE_NAME: ${{ needs.validate.outputs.remote_name }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          REGISTRY_IMAGE: docker.io/library/registry@sha256:3d527cee870ddd0fc8a31f99b2fdfb6451801a8dd4f5a92c1ec36dae24c14274  # 3.1.1, linux/amd64
          TRIVY_IMAGE: docker.io/aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb  # v0.76.2
          VEX_CONFIG: ${{ steps.trivy-config.outputs.vex_config }}
        run: |
          set -euo pipefail

          trivy_dir="$RUNNER_TEMP/trivy"
          state="$trivy_dir/registry-state"
          mkdir -p "$trivy_dir/cache" "$trivy_dir/reports"
          mkdir -m 700 "$state"
          mkdir -m 700 "$state/certs" "$state/docker-config"

          # Keep the Harbor project and image name, but use one canonical host.
          repository="${REMOTE_NAME#*/}"
          if [[ "$repository" == "$REMOTE_NAME" || -z "$repository" ]]; then
            echo "::error::Invalid Harbor repository name"
            exit 1
          fi
          if [[ "$PROD_HOST" != 'harbor-core:80' ]]; then
            echo "::error::Unexpected registry authority: $PROD_HOST"
            exit 1
          fi
          registry_host="${PROD_HOST%:*}"
          registry_port="${PROD_HOST##*:}"
          registry_name="$PROD_HOST/$repository"
          expected_vex_key="pkg:oci/${repository##*/}?repository_url=${registry_name//\//%2F}"
          echo "Expected VEX image index PURL: $expected_vex_key"
          registry_ref="${registry_name}:${IMAGE_TAG}"
          registry_container="trivy-registry-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          registry_network="${registry_container}-net"
          ca_dir="/etc/docker/certs.d/$PROD_HOST"
          ca_file="$ca_dir/trivy-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.crt"

          # Do not shadow a pre-existing hosts entry or overwrite a trusted CA.
          if awk -v host="$registry_host" '{
            sub(/#.*/, "")
            for (i = 2; i <= NF; i++) if (tolower($i) == tolower(host)) found = 1
          } END { exit !found }' /etc/hosts; then
            echo "::error::Registry hostname already has an /etc/hosts entry"
            exit 1
          fi
          if sudo test -e "$ca_file" || sudo test -L "$ca_file"; then
            echo "::error::Temporary Docker CA path already exists"
            exit 1
          fi
          if docker image inspect "$registry_ref" >/dev/null 2>&1; then
            echo "::error::Temporary registry tag already exists"
            exit 1
          fi
          # This workflow uses a local Docker daemon on a GitHub-hosted runner.
          # Refuse a daemon proxy rather than risk a push to the real registry.
          if [[ -n "$(docker info --format '{{.HTTPProxy}}{{.HTTPSProxy}}')" ]]; then
            echo "::error::Docker daemon proxy is configured; cannot guarantee a local-only push"
            exit 1
          fi

          trivy_args=(
            --rm
            --volume "$trivy_dir/cache:/cache"
            --volume "$trivy_dir/reports:/reports"
            --volume "$VEX_CONFIG:/root/.trivy/vex/repository.yaml:ro"
            --env TRIVY_CACHE_DIR=/cache
            --env GITHUB_TOKEN=
          )

          # Download the trusted VEX repository and registry image before
          # temporarily changing the Harbor hostname on the runner.
          docker run "${trivy_args[@]}" "$TRIVY_IMAGE" vex repo download
          docker pull "$REGISTRY_IMAGE"

          # TLS uses the DNS hostname, not the host:port authority.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=$registry_host" \
            -addext "subjectAltName=DNS:$registry_host" \
            -keyout "$state/certs/tls.key" -out "$state/certs/tls.crt" 2>/dev/null
          # Trivy also needs public roots for vulnerability DB downloads.
          cat /etc/ssl/certs/ca-certificates.crt "$state/certs/tls.crt" \
            > "$state/ca-bundle.crt"

          # Expose the temporary registry only on the runner's loopback.
          # Use a dedicated bridge so Trivy does not need host networking.
          docker network create --driver bridge "$registry_network" > "$state/network-id"
          network_id="$(cat "$state/network-id")"
          docker create --name "$registry_container" \
            --network "$network_id" \
            --network-alias "$registry_host" \
            --publish "127.0.0.1:$registry_port:$registry_port" \
            --volume "$state/certs:/certs:ro" \
            --env "REGISTRY_HTTP_ADDR=0.0.0.0:$registry_port" \
            --env REGISTRY_HTTP_TLS_CERTIFICATE=/certs/tls.crt \
            --env REGISTRY_HTTP_TLS_KEY=/certs/tls.key \
            "$REGISTRY_IMAGE" > "$state/container-id"
          registry_id="$(cat "$state/container-id")"
          docker start "$registry_id" >/dev/null

          registry_curl=(
            --noproxy '*'
            --resolve "$registry_host:$registry_port:127.0.0.1"
            --cacert "$state/certs/tls.crt"
            --fail --silent --show-error --max-time 5
          )
          ready=false
          for ((i = 0; i < 30; i++)); do
            if curl "${registry_curl[@]}" "https://$PROD_HOST/v2/" >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 1
          done
          if [[ "$ready" != true ]]; then
            echo "::error::Temporary HTTPS registry did not become ready"
            exit 1
          fi

          # The Docker daemon must resolve the canonical hostname locally.
          cp /etc/hosts "$state/hosts.backup.tmp"
          mv -- "$state/hosts.backup.tmp" "$state/hosts.original"
          printf '\n127.0.0.1 %s # temporary Trivy registry\n' "$registry_host" | \
            sudo tee -a /etc/hosts >/dev/null
          if [[ "$(getent ahosts "$registry_host" | awk '{print $1}' | sort -u)" != 127.0.0.1 ]]; then
            echo "::error::Registry hostname does not resolve exclusively to loopback"
            exit 1
          fi
          if ! sudo test -d "$ca_dir"; then
            touch "$state/ca-dir-created"
            sudo mkdir -p "$ca_dir"
          fi
          touch "$state/ca-managed"
          sudo install -m 0644 "$state/certs/tls.crt" "$ca_file"

          # Use an isolated anonymous Docker config for the temporary push.
          printf '{"auths":{"%s":{}}}\n' "$PROD_HOST" > "$state/docker-config/config.json"
          printf '%s\n' "$registry_ref" > "$state/registry-ref"
          echo "Pushing image to temporary registry: $registry_ref"
          docker tag "$LOCAL_IMAGE" "$registry_ref"
          docker --config "$state/docker-config" push "$registry_ref" 2>&1 | \
            tee "$trivy_dir/registry-push.log"

          # Pin the scan to the manifest digest returned by the push.
          digest="$(awk '{
            for (i = 1; i < NF; i++) {
              if ($i == "digest:" && $(i+1) ~ /^sha256:/) d = $(i+1)
            }
          } END { print d }' "$trivy_dir/registry-push.log")"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Could not determine pushed image manifest digest"
            exit 1
          fi

          # Confirm the manifest exists in the loopback registry, not Harbor.
          local_digest="$(curl "${registry_curl[@]}" --head \
            --header 'Accept: application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json, application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json' \
            "https://$PROD_HOST/v2/$repository/manifests/$digest" | \
            awk 'tolower($1) == "docker-content-digest:" { sub(/\r$/, "", $2); print $2 }')"
          if [[ "$local_digest" != "$digest" ]]; then
            echo "::error::Pushed manifest could not be verified in the local registry"
            exit 1
          fi

          scan_ref="${registry_name}@${digest}"
          echo "Scanning registry image: $scan_ref"

          # Restore the runner's real hostname resolution and remove the
          # Docker CA as soon as the push is finished. The always() cleanup
          # below repeats these operations if the scan fails earlier.
          sudo tee /etc/hosts < "$state/hosts.original" >/dev/null
          cmp -s "$state/hosts.original" /etc/hosts
          sudo rm -f -- "$ca_file"
          if [[ -f "$state/ca-dir-created" ]]; then
            sudo rmdir -- "$ca_dir"
          fi
          rm -f -- "$state/hosts.original" "$state/ca-managed" "$state/ca-dir-created"

          # Containers do not inherit the runner's /etc/hosts. Map PROD_HOST
          # directly to the registry's private bridge IP inside Trivy only.
          registry_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$registry_id")"
          if [[ ! "$registry_ip" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Could not determine temporary registry IP"
            exit 1
          fi
          docker run "${trivy_args[@]}" \
            --network "$network_id" \
            --add-host "$registry_host:$registry_ip" \
            --volume "$state/ca-bundle.crt:/trivy-ca-bundle.crt:ro" \
            --env SSL_CERT_FILE=/trivy-ca-bundle.crt \
            --env "NO_PROXY=$registry_host,$PROD_HOST,localhost,127.0.0.1" \
            --env "no_proxy=$registry_host,$PROD_HOST,localhost,127.0.0.1" \
            "$TRIVY_IMAGE" image \
            --image-src remote \
            --vex repo \
            --skip-vex-repo-update \
            --show-suppressed \
            --format json \
            --output /reports/trivy-report.json \
            --exit-code 0 \
            --pkg-types os,library \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --scanners vuln \
            "$scan_ref"

          # A successful scan must have the intended product identity, even
          # for dev (where scanner errors are normally report-only).
          echo "identity_check_required=true" >> "$GITHUB_OUTPUT"
          report="$trivy_dir/reports/trivy-report.json"
          echo "Trivy RepoDigests: $(jq -c '.Metadata.RepoDigests' "$report")"
          # parseOCI() uses the first RepoDigest, not just any matching digest.
          if ! jq -e --arg ref "$scan_ref" \
            '.ArtifactName == $ref and .Metadata.RepoDigests[0] == $ref' \
            "$report" >/dev/null; then
            echo "::error::Trivy scanned a different registry reference; expected $scan_ref"
            exit 1
          fi

          # Extract the actual OCI PURL with the same pinned Trivy binary.
          image_purl="$(
            docker run --rm --network none \
              --volume "$trivy_dir/reports:/reports:ro" \
              "$TRIVY_IMAGE" convert --format cyclonedx \
              /reports/trivy-report.json |
              jq -er '.metadata.component.purl | strings | select(startswith("pkg:oci/"))'
          )"
          echo "Trivy image PURL: $image_purl"
          if [[ "$image_purl" != "pkg:oci/${repository##*/}@$digest?"* ]]; then
            echo "::error::Trivy image PURL has an unexpected name or manifest digest"
            exit 1
          fi

          # Reproduce Trivy v0.76.2 RepositorySet.NotAffected() normalization:
          # remove the version and every qualifier except repository_url.
          purl_name="${image_purl%%@*}"
          purl_query="${image_purl#*\?}"
          IFS='&' read -r -a purl_qualifiers <<< "$purl_query"
          repository_qualifier=""
          for qualifier in "${purl_qualifiers[@]}"; do
            if [[ "$qualifier" == repository_url=* ]]; then
              repository_qualifier="$qualifier"
              break
            fi
          done
          actual_vex_key="$purl_name?$repository_qualifier"
          echo "Trivy VEX image index PURL: $actual_vex_key"
          if [[ "$actual_vex_key" != "$expected_vex_key" ]]; then
            echo "::error::Unexpected VEX image index PURL; expected $expected_vex_key"
            exit 1
          fi
          echo "identity_verified=true" >> "$GITHUB_OUTPUT"

      - name: Remove temporary HTTPS registry and restore runner configuration
        if: ${{ always() }}
        shell: bash
        run: |
          set -uo pipefail
          state="$RUNNER_TEMP/trivy/registry-state"
          ca_dir="/etc/docker/certs.d/$PROD_HOST"
          ca_file="$ca_dir/trivy-local-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.crt"
          cleanup_status=0

          if [[ -d "$state" ]]; then
            # Restore the original host configuration even on scan failure.
            if [[ -f "$state/hosts.original" ]]; then
              sudo tee /etc/hosts < "$state/hosts.original" >/dev/null || cleanup_status=1
              cmp -s "$state/hosts.original" /etc/hosts || cleanup_status=1
            fi
            if [[ -f "$state/ca-managed" ]]; then
              sudo rm -f -- "$ca_file" || cleanup_status=1
              if sudo test -e "$ca_file" || sudo test -L "$ca_file"; then
                cleanup_status=1
              fi
            fi
            if [[ -f "$state/ca-dir-created" ]] && sudo test -d "$ca_dir"; then
              sudo rmdir -- "$ca_dir" || cleanup_status=1
            fi

            if [[ -s "$state/container-id" ]]; then
              docker rm -fv "$(cat "$state/container-id")" >/dev/null || cleanup_status=1
            fi
            if [[ -s "$state/network-id" ]]; then
              docker network rm "$(cat "$state/network-id")" >/dev/null || cleanup_status=1
            fi
            if [[ -s "$state/registry-ref" ]]; then
              registry_ref="$(cat "$state/registry-ref")"
              if docker image inspect "$registry_ref" >/dev/null 2>&1; then
                docker image rm "$registry_ref" >/dev/null || cleanup_status=1
              fi
            fi
          fi

          if (( cleanup_status != 0 )); then
            echo "::error::Temporary registry cleanup failed; refusing Harbor publication"
            exit 1
          fi
          rm -rf -- "$state"

      - name: Remove temporary VEX credentials
        if: ${{ always() && steps.trivy-config.outputs.vex_config != '' }}
        shell: bash
        env:
          VEX_CONFIG: ${{ steps.trivy-config.outputs.vex_config }}
        run: |
          rm -f -- "$VEX_CONFIG"

      - name: Upload Trivy vulnerability report
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: trivy-${{ github.repository_id }}-${{ inputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/trivy/reports/trivy-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce canonical Trivy image identity
        if: ${{ always() && !cancelled() && steps.trivy-scan.outputs.identity_check_required == 'true' && steps.trivy-scan.outputs.identity_verified != 'true' }}
        shell: bash
        run: |
          echo "::error::Trivy image identity was not verified; refusing Harbor publication"
          exit 1

      - name: Summarize vulnerability report and enforce policy
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: summarize-trivy
        env:
          TARGET: ${{ inputs.target }}
          TRIVY_REPORT_ONLY: ${{ inputs.target == 'dev' }}
          TRIVY_SCAN_OUTCOME: ${{ steps.trivy-scan.outcome }}
          TRIVY_REPORT: ${{ runner.temp }}/trivy/reports/trivy-report.json

      - name: Login to development Harbor
        if: ${{ inputs.target == 'dev' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: registry.dev.k8s-dev.org
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_DEV_TOKEN }}

      - name: Login to staging Harbor
        if: ${{ inputs.target == 'staging' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: registry.staging.k8s-staging.org
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_STAGE_TOKEN }}

      - name: Login to production Harbor
        if: ${{ inputs.target == 'prod' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: registry.prod.k8s-prod.org
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_PROD_TOKEN }}

      - name: Login to critical Harbor
        if: ${{ inputs.target == 'critical' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3
        with:
          registry: registry.critical.k8s-prod.org
          username: ${{ vars.REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_CRIT_TOKEN }}

      - name: Prevent production release rollback
        if: ${{ needs.validate.outputs.is_release == 'true' && inputs.target == 'prod' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: check-rollback
        env:
          HARBOR_TOKEN: ${{ secrets.HARBOR_PROD_TOKEN }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REMOTE_NAME: ${{ needs.validate.outputs.remote_name }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}

      - name: Prevent critical release rollback
        if: ${{ needs.validate.outputs.is_release == 'true' && inputs.target == 'critical' }}
        uses: lidofinance/actions/.github/actions/k8s-harbor-helper@7ffc0136e460b5c66d8c9f84b2f2a89dedd0366a
        with:
          command: check-rollback
        env:
          HARBOR_TOKEN: ${{ secrets.HARBOR_CRIT_TOKEN }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          REGISTRY_USERNAME: ${{ vars.REGISTRY_USERNAME }}
          REMOTE_NAME: ${{ needs.validate.outputs.remote_name }}
          SOURCE_BRANCH: ${{ needs.validate.outputs.source_branch }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}

      - name: Push Docker image
        id: push
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          LOCAL_IMAGE: local-build:${{ github.run_id }}-${{ github.run_attempt }}
          REMOTE_NAME: ${{ needs.validate.outputs.remote_name }}
        run: |
          set -euo pipefail

          remote_ref="${REMOTE_NAME}:${IMAGE_TAG}"
          docker tag "$LOCAL_IMAGE" "$remote_ref"
          docker push "$remote_ref"
          echo "image_ref=${remote_ref}" >> "$GITHUB_OUTPUT"
