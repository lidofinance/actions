name: Lint K8s workflows

on:
  pull_request:
    paths:
      - ".github/requirements/workflow-lint.txt"
      - ".github/scripts/check-workflow-pins.py"
      - ".github/scripts/tests/test_check_workflow_pins.py"
      - ".github/workflows/ci-k8s-workflow-lint.yml"
      - ".github/workflows/k8s-build-push-harbor.yml"
      - ".github/workflows/k8s-validate-helmcharts.yml"
      - ".yamllint"
  push:
    branches:
      - main
    paths:
      - ".github/requirements/workflow-lint.txt"
      - ".github/scripts/check-workflow-pins.py"
      - ".github/scripts/tests/test_check_workflow_pins.py"
      - ".github/workflows/ci-k8s-workflow-lint.yml"
      - ".github/workflows/k8s-build-push-harbor.yml"
      - ".github/workflows/k8s-validate-helmcharts.yml"
      - ".yamllint"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint K8s workflows
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.10.12"

      - name: Run actionlint and ShellCheck
        shell: bash
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667  # v1.7.12
        run: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            "$ACTIONLINT_IMAGE" \
            -color \
            .github/workflows/ci-k8s-workflow-lint.yml \
            .github/workflows/k8s-build-push-harbor.yml \
            .github/workflows/k8s-validate-helmcharts.yml

      - name: Install pinned Python lint dependencies
        shell: bash
        env:
          LINT_VENV: ${{ runner.temp }}/workflow-lint
        run: |
          set -euo pipefail

          python3 -m venv "$LINT_VENV"
          "$LINT_VENV/bin/pip" install \
            --disable-pip-version-check \
            --no-cache-dir \
            --only-binary=:all: \
            --require-hashes \
            --requirement .github/requirements/workflow-lint.txt

      - name: Test immutable reference checker
        shell: bash
        env:
          LINT_VENV: ${{ runner.temp }}/workflow-lint
        run: |
          set -euo pipefail

          "$LINT_VENV/bin/python" -m unittest discover \
            --start-directory .github/scripts/tests \
            --pattern 'test_*.py' \
            --verbose

      - name: Run yamllint
        shell: bash
        env:
          LINT_VENV: ${{ runner.temp }}/workflow-lint
        run: |
          set -euo pipefail

          "$LINT_VENV/bin/yamllint" --config-file .yamllint \
            .github/workflows/ci-k8s-workflow-lint.yml \
            .github/workflows/k8s-build-push-harbor.yml \
            .github/workflows/k8s-validate-helmcharts.yml

      - name: Check immutable action references
        shell: bash
        env:
          LINT_VENV: ${{ runner.temp }}/workflow-lint
        run: |
          set -euo pipefail

          "$LINT_VENV/bin/python" .github/scripts/check-workflow-pins.py \
            .github/workflows/ci-k8s-workflow-lint.yml \
            .github/workflows/k8s-build-push-harbor.yml \
            .github/workflows/k8s-validate-helmcharts.yml

      - name: Check whitespace errors
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git cat-file -e "${BASE_SHA}^{commit}"; then
            git diff --check "${BASE_SHA}...HEAD"
          else
            git show --check --format= HEAD
          fi
